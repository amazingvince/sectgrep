name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust-workspace:
    name: Rust workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install ripgrep for live grep parity (the goldens cover the case where it is absent)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep && rg --version
      - name: Cache the embedding model (fetched from the Hugging Face hub at index time only)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-retrieval-32M-v1
      - run: cargo build --workspace --locked
      - name: Warm the model cache once (tests spawn several sect processes in parallel)
        run: cargo run -p sect-cli --locked -- index fixtures/corpus
      - run: cargo test --workspace --locked
      - name: Fixture passes the B.2 contract check
        run: cargo run -p sect-cli --locked -- index --validate-only fixtures/corpus
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Pi and Claude Agent SDK examples call the seven verbs through the built binary
        run: |
          pnpm install --frozen-lockfile
          SECT_BIN=$PWD/target/debug/sect pnpm -r --filter "./examples/*" test
      - name: Freshness stat at 10k files (spec B.6 reference number on Linux)
        run: |
          python3 eval/gen_synthetic.py --sections 10000 --out /tmp/syn
          cargo build --release -p sect-cli
          target/release/sect index /tmp/syn --embedding none | head -3
          for i in 1 2 3 4 5; do target/release/sect status --corpus /tmp/syn --json | python3 -c "import sys,json; f=json.load(sys.stdin)['freshness']; print('B6_STAT_MS', f['stat_ms'], f['state'])"; done
          echo "(z) touched" >> /tmp/syn/syn-title-7/1/1.1/7-1.1.md
          target/release/sect index /tmp/syn --json | python3 -c "import sys,json; r=json.load(sys.stdin); print('B6_INCREMENTAL_MS', r['elapsed_ms'], r['mode'], r['changed'])"


  converter:
    name: sect-convert (TypeScript, WS2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test

  fixture-and-prototype:
    name: Fixture contract + milestone-0 eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Cache the embedding model (the hub rate-limits anonymous fetches)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-retrieval-32M-v1
      - name: Install the milestone-0 prototype
        run: uv sync --project proto
      - name: Validate the fixture corpus against the B.2 contract
        run: uv run --project proto sect-proto validate fixtures/corpus
      - name: Milestone-0 eval (gate Recall@5 >= 0.85 on locate and definition)
        run: uv run --project proto sect-proto eval --corpus fixtures/corpus --questions eval/questions --out eval/results/m0.md --gate 0.85 --filter-rank 3
