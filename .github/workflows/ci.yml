name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-retrieval-32M-v1
      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - name: Export the shared binary path
        shell: pwsh
        run: |
          $binary = if ($IsWindows) { "sect.exe" } else { "sect" }
          "SECT_BIN=$((Resolve-Path (Join-Path 'target/debug' $binary)).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Warm the local model once
        run: cargo run -p sect-cli --locked -- index fixtures/corpus
      - run: cargo test --workspace --locked
      - run: pnpm -r build
      - run: pnpm -r test
      - name: Check the Rust and TypeScript contracts agree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo run -p sect-core --locked --example knowledge_schema > docs/knowledge.schema.json
          cargo run -p sect-core --locked --example document_schema > docs/document.schema.json
          cargo run -p sect-core --locked --example identity_schema > docs/identity.schema.json
          cargo run -p sect-core --locked --example sections_schema > docs/sections.schema.json
          node packages/sect-convert/scripts/generate-contract.mjs
          git diff --exit-code -- docs/knowledge.schema.json docs/document.schema.json docs/identity.schema.json docs/sections.schema.json packages/sect-convert/src/knowledge.generated.ts packages/sect-convert/src/document.generated.ts packages/sect-convert/src/identity.generated.ts packages/sect-convert/src/sections.generated.ts
      - name: Structural fixture contract
        run: cargo run -p sect-cli --locked -- index --validate-only fixtures/corpus
      - name: Evaluation runner invariants
        run: python -m unittest discover -s eval -p "test_*.py"
