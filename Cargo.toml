# sectgrep workspace. Crate layout from spec B.7; crates not yet needed are stubs that name their milestone.
[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "Apache-2.0"
description = "sect: single-binary search and navigation over a structured markdown corpus of rules and guidelines, built for AI agents"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
blake3 = "1"
ignore = "0.4"
chrono = { version = "0.4", features = ["serde"] }
comrak = { version = "0.54", default-features = false }
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
regex = "1"
rayon = "1"
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-std"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tempfile = "3"
tantivy = "0.26"
model2vec-rs = { version = "0.2", default-features = false, features = ["fancy-regex", "hf-hub"] }
rrf = "0.1"

sect-core = { path = "crates/sect-core" }
sect-corpus = { path = "crates/sect-corpus" }
sect-struct = { path = "crates/sect-struct" }
sect-exact = { path = "crates/sect-exact" }
sect-ngram = { path = "crates/sect-ngram" }
sect-lexical = { path = "crates/sect-lexical" }
sect-semantic = { path = "crates/sect-semantic" }
sect-rank = { path = "crates/sect-rank" }
sect-index = { path = "crates/sect-index" }
sect-query = { path = "crates/sect-query" }
sect-format = { path = "crates/sect-format" }
sect-mcp = { path = "crates/sect-mcp" }
sect-verbs = { path = "crates/sect-verbs" }

[profile.release]
lto = "thin"
codegen-units = 1
