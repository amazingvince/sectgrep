[project]
name = "sect-proto"
version = "0.0.1"
description = "Milestone-0 chunking/ranking prototype for sectgrep. Throwaway; not shipped, not published."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "semble>=0.5.5",
  "model2vec>=0.4.0",
  "PyStemmer>=2.2",
  "pyyaml>=6.0",
  "numpy>=1.24",
]

[project.scripts]
sect-proto = "sect_proto.cli:main"

[tool.uv]
# Keep every cache inside the checkout so a prototype run touches nothing outside the repo.
cache-dir = "../.uv-cache"
python-preference = "system"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sect_proto"]
